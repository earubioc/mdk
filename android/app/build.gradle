plugins {
    id 'com.android.application'
}

// La versión se toma de package.json: una sola fuente para Windows y Android.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.').collect { it.toInteger() }

android {
    namespace 'com.vdcprocesslab.mdk'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.vdcprocesslab.mdkraft'
        // AdMob: por defecto IDs de PRUEBA de Google. En producción exportar
        // MDK_ADMOB_APP_ID, MDK_ADMOB_BANNER_ID y MDK_ADMOB_INTERSTITIAL_ID (los de tu cuenta de AdMob).
        manifestPlaceholders = [admobAppId: System.getenv('MDK_ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'String', 'ADMOB_BANNER_ID',
            '"' + (System.getenv('MDK_ADMOB_BANNER_ID') ?: 'ca-app-pub-3940256099942544/6300978111') + '"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID',
            '"' + (System.getenv('MDK_ADMOB_INTERSTITIAL_ID') ?: 'ca-app-pub-3940256099942544/1033173712') + '"'
        // Producto in-app (no consumible) creado en Play Console: «Quitar anuncios», 1.99 USD.
        buildConfigField 'String', 'REMOVE_ADS_PRODUCT_ID', '"remove_ads"'
        minSdk 24
        targetSdk 36
        // Play exige un versionCode mayor en cada subida: CI lo pasa (número de ejecución).
        versionCode System.getenv('MDK_VERSION_CODE') ? System.getenv('MDK_VERSION_CODE').toInteger() : vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
    }

    // Sin keystore propia se firma con la clave de depuración (APK instalable
    // por sideload). Para publicar: exportar MDK_KEYSTORE, MDK_KEYSTORE_PASSWORD,
    // MDK_KEY_ALIAS y MDK_KEY_PASSWORD.
    signingConfigs {
        release {
            if (System.getenv('MDK_KEYSTORE')) {
                storeFile file(System.getenv('MDK_KEYSTORE'))
                storePassword System.getenv('MDK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MDK_KEY_ALIAS')
                keyPassword System.getenv('MDK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('MDK_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/webassets')
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.android.billingclient:billing:7.1.1'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}

// La UI es la misma carpeta src/ de la app de escritorio, sin copias en el repo.
// Se empaqueta como assets y se le inyecta el puente Android (window.mdk).
tasks.register('syncWebAssets', Copy) {
    from('../../src') {
        exclude 'index.html'
    }
    from('../../src/index.html') {
        filter { line ->
            line.contains('<script src="renderer.js">')
                ? '<script>var module = { exports: {} };</script>\n<script src="i18n/strings.js"></script>\n<script src="android-bridge.js"></script>\n' + line
                : line.replace('</head>', '<link rel="stylesheet" href="android-mobile.css">\n</head>')
        }
    }
    from('src/overlay')
    into layout.buildDirectory.dir('generated/webassets')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'syncWebAssets' }
