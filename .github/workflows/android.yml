name: Android

# Compila el APK (instalar a mano) y el AAB (subir a Google Play) de MD Kraft (carpeta android/, reutiliza la UI de src/).
#  - En cada PR/push que toque Android: genera el APK y lo sube como artefacto.
#  - Al pushear un tag "vX.Y.Z": además lo adjunta al GitHub Release (junto a los .exe).
#  - Manual: Actions > Android > Run workflow.
#
# Firma: sin secrets, el APK sale firmado con una clave de depuración (instalable
# por sideload, pero cada build usa una clave distinta, así que no actualiza
# sobre uno anterior). Para APKs actualizables, crea una keystore una sola vez y
# guarda estos secrets: MDK_KEYSTORE_BASE64 (base64 del .jks), MDK_KEYSTORE_PASSWORD,
# MDK_KEY_ALIAS, MDK_KEY_PASSWORD.
# Anuncios: sin MDK_ADMOB_APP_ID / MDK_ADMOB_BANNER_ID / MDK_ADMOB_INTERSTITIAL_ID salen anuncios de PRUEBA de Google.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', 'src/**', 'package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      MDK_KEYSTORE_BASE64: ${{ secrets.MDK_KEYSTORE_BASE64 }}
      MDK_KEYSTORE_PASSWORD: ${{ secrets.MDK_KEYSTORE_PASSWORD }}
      MDK_KEY_ALIAS: ${{ secrets.MDK_KEY_ALIAS }}
      MDK_KEY_PASSWORD: ${{ secrets.MDK_KEY_PASSWORD }}
      MDK_ADMOB_APP_ID: ${{ secrets.MDK_ADMOB_APP_ID }}
      MDK_ADMOB_BANNER_ID: ${{ secrets.MDK_ADMOB_BANNER_ID }}
      MDK_ADMOB_INTERSTITIAL_ID: ${{ secrets.MDK_ADMOB_INTERSTITIAL_ID }}
      MDK_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Preparar keystore (si hay secrets)
        if: ${{ env.MDK_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$MDK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mdk.jks"
          echo "MDK_KEYSTORE=$RUNNER_TEMP/mdk.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Renombrar APK y AAB
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MDKraft.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MDKraft.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MDKraft
          path: |
            MDKraft.apk
            MDKraft.aab

      - name: Adjuntar al GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MDKraft.apk
            MDKraft.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
