name: Release

# Al pushear un tag "vX.Y.Z" (después de subir la versión en package.json),
# compila el instalador + la versión portable en un runner de Windows real y
# los publica automáticamente como GitHub Release, adjuntando los .exe.
#
# Flujo para publicar una versión nueva:
#   1. Actualiza "version" en package.json y agrega la entrada en CHANGELOG.md
#      (y en src/i18n/strings.js si el changelog mostrado en la app cambió).
#   2. git commit -am "Release vX.Y.Z"
#   3. git tag vX.Y.Z
#   4. git push origin main --tags
#
# Este workflow se dispara con el push del tag y hace el resto.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar portable + instalador
        run: npm run dist

      - name: Publicar GitHub Release con los .exe
        uses: softprops/action-gh-release@v2
        with:
          name: MDK ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            - **MDK-portable.exe**: runs directly, nothing to install.
            - **MDK-Setup-X.X.X.exe**: installer with a wizard (Desktop/Start Menu shortcuts). Updates itself automatically.
            - Install via winget: `winget install earubioc.MDK`
          files: |
            release/*.exe
            release/latest.yml
            release/*.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Envía el PR a microsoft/winget-pkgs con la versión nueva. Requiere el secret
      # WINGET_TOKEN (PAT clásico con scope public_repo) y que el paquete ya exista
      # en winget-pkgs (primer envío manual, ver DECISIONS.md #34). Si no hay
      # secret, se omite sin fallar el release.
      - name: Publicar en winget
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: earubioc.MDK
          installers-regex: 'MDK-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
